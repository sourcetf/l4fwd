name: build

# 测试 → 构建 → 端到端 → 发布，三个平台一起跑。
#
# 触发与行为：
#   push 到 master/main    → 测试、构建、端到端，更新 "latest" 预发布（跟随最新提交）
#   push tag v*            → 测试、构建、端到端，发布正式 Release（标记为 Latest）
#   pull_request           → 只跑测试与端到端（不发布）
#   手动 workflow_dispatch → 同 master
#
# 平台：
#   Windows  windows-latest          原始套接字（SIO_RCVALL）、UAC 清单、netsh 防火墙
#   Linux    ubuntu-latest           原始套接字（AF_PACKET）、nft/ufw 手动放行
#   OpenBSD  vmactions/openbsd-vm    /dev/bpf 混杂捕获；测试在虚拟机里以 root 跑
#
# 原始套接字需要特权：Linux 上的测试与端到端用 sudo 执行；OpenBSD 虚拟机里默认就是 root。

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) 测试门禁：go vet、gofmt、单元 + 集成测试（真实 TCP/UDP/RAW 收发）。
  # ---------------------------------------------------------------------------
  test:
    name: 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        shell: bash
        run: go vet ./...

      - name: gofmt 检查
        shell: bash
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./test ./build ./tools)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: 单元 + 集成测试
        shell: bash
        # Linux 的原始套接字用例需要 root/CAP_NET_RAW，用 sudo 跑；GOCACHE 换到
        # /tmp，免得 root 在 runner 的缓存目录里留下读不了的文件。
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo env PATH="$PATH" GOCACHE=/tmp/gocache-root GOMODCACHE="$GOMODCACHE" \
              GOPROXY="$GOPROXY" GOFLAGS="$GOFLAGS" \
              go test ./internal/... -count=1 -timeout 900s
          else
            go test ./internal/... -count=1 -timeout 900s
          fi

      - name: 覆盖率
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        # 覆盖率步骤以普通用户跑：需要特权的原始套接字用例会自行跳过，
        # 协议解析、会话表、校验和等纯逻辑仍然计入覆盖率。
        run: go test ./internal/... -count=1 -coverprofile=coverage.out -covermode=atomic

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 1b) OpenBSD：在 Linux runner 上启动 OpenBSD 虚拟机，用官方 Go tarball 跑测试。
  # ---------------------------------------------------------------------------
  test-openbsd:
    name: 测试 (openbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: OpenBSD 虚拟机里跑 vet / gofmt / 测试
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          usesh: true
          # OpenBSD 自带的 ftp 支持 HTTPS，不需要先装 curl。
          prepare: |
            ftp -o /tmp/go.tgz https://go.dev/dl/go1.26.0.openbsd-amd64.tar.gz
            tar -C /usr/local -xzf /tmp/go.tgz
          run: |
            set -e
            export PATH=/usr/local/go/bin:$PATH
            go version
            go vet ./...
            unformatted="$(gofmt -l ./cmd ./internal ./test ./build ./tools)"
            if [ -n "$unformatted" ]; then
              echo "以下文件未通过 gofmt："
              echo "$unformatted"
              exit 1
            fi
            go test ./internal/... -count=1 -timeout 900s

  # ---------------------------------------------------------------------------
  # 2) 构建三个平台的发布产物。
  # ---------------------------------------------------------------------------
  build:
    name: 构建 (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: openbsd
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0-latest"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号：$v"

      - name: 构建
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_OS: ${{ matrix.target }}
        run: bash scripts/build.sh

      - name: 整理产物
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$TARGET" = "windows" ]; then
            cp bin/l4fwd.exe bin/l4fwd-admin.exe bin/rawtest.exe dist/
          elif [ "$TARGET" = "linux" ]; then
            cp bin/l4fwd dist/l4fwd-linux-amd64
            [ -f bin/rawtest ] && cp bin/rawtest dist/rawtest-linux-amd64
          else
            cp bin/l4fwd-openbsd-amd64 dist/l4fwd-openbsd-amd64
            [ -f bin/rawtest-openbsd-amd64 ] && cp bin/rawtest-openbsd-amd64 dist/rawtest-openbsd-amd64
          fi
          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: l4fwd-${{ matrix.target }}-amd64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) 端到端：用刚构建出来的二进制跑真实报文测试。
  #
  #    Windows：在本机网卡上临时加两个别名地址（客户端 172.16.0.40 / 目标
  #    172.16.0.41），RAW 与混杂捕获用例需要它们；回环流量不会交给 SIO_RCVALL。
  #    Linux/OpenBSD：127.0.0.0/8 全部是本机地址，默认用 127.0.0.2/127.0.0.3，
  #    原始套接字在 sudo / root 下运行。
  # ---------------------------------------------------------------------------
  e2e:
    name: 端到端 (${{ matrix.target }})
    needs: build
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: l4fwd-${{ matrix.target }}-amd64
          path: dist

      - name: 解出二进制
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p bin
          if [ "$TARGET" = "windows" ]; then
            cp dist/l4fwd.exe dist/rawtest.exe bin/
          else
            cp dist/l4fwd-linux-amd64 bin/l4fwd
            chmod +x bin/l4fwd
          fi
          ls -la bin/

      # ---- Windows: 别名地址（失败时 RAW 用例自动跳过，其余照常） ----
      - name: 配置别名地址并选择监听地址
        if: matrix.target == 'windows'
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $primary = Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -notlike '127.*' -and $_.InterfaceAlias -notmatch 'Loopback' } |
            Sort-Object -Property SkipAsSource | Select-Object -First 1
          if (-not $primary) { throw "找不到可用的 IPv4 主地址" }
          Write-Host "监听地址使用 $($primary.IPAddress)（网卡 $($primary.InterfaceAlias)）"
          "L4FWD_E2E_LISTEN=$($primary.IPAddress)" |
            Out-File -Append -Encoding ascii $env:GITHUB_ENV
          powershell -ExecutionPolicy Bypass -File scripts/e2e-aliases.ps1 -Add -InterfaceName "$($primary.InterfaceAlias)"

      - name: 端到端测试 (Windows)
        if: matrix.target == 'windows'
        shell: bash
        env:
          L4FWD_BIN: ${{ github.workspace }}\bin\l4fwd.exe
          L4FWD_E2E_CLIENT: 172.16.0.40
          L4FWD_E2E_TARGET: 172.16.0.41
        timeout-minutes: 15
        run: bash scripts/e2e.sh

      - name: 清理别名地址
        if: always() && matrix.target == 'windows'
        shell: pwsh
        timeout-minutes: 2
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File scripts/e2e-aliases.ps1 -Remove

      - name: 端到端测试 (Linux)
        if: matrix.target == 'linux'
        shell: bash
        timeout-minutes: 15
        run: |
          sudo env PATH="$PATH" GOCACHE=/tmp/gocache-root GOMODCACHE="$GOMODCACHE" \
            GOPROXY="$GOPROXY" GOFLAGS="$GOFLAGS" L4FWD_BIN="$PWD/bin/l4fwd" \
            bash scripts/e2e.sh

  # ---------------------------------------------------------------------------
  # 3b) OpenBSD 端到端：用交叉编译出来的二进制，在虚拟机里跑真实报文测试。
  # ---------------------------------------------------------------------------
  e2e-openbsd:
    name: 端到端 (openbsd)
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: l4fwd-openbsd-amd64
          path: dist

      - name: OpenBSD 虚拟机里跑端到端
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          usesh: true
          prepare: |
            ftp -o /tmp/go.tgz https://go.dev/dl/go1.26.0.openbsd-amd64.tar.gz
            tar -C /usr/local -xzf /tmp/go.tgz
          run: |
            set -e
            export PATH=/usr/local/go/bin:$PATH
            cp dist/l4fwd-openbsd-amd64 bin/l4fwd-openbsd-amd64
            chmod +x bin/l4fwd-openbsd-amd64
            L4FWD_BIN="$PWD/bin/l4fwd-openbsd-amd64" \
              L4FWD_E2E_CLIENT=127.0.0.2 L4FWD_E2E_LISTEN=127.0.0.1 L4FWD_E2E_TARGET=127.0.0.3 \
              go test ./test/e2e/ -count=1 -timeout 900s -v

  # ---------------------------------------------------------------------------
  # 4) 发布：
  #    tag v*      → 正式 Release（标记为 Latest），资产挂在 tag 上
  #    master/main → 覆盖更新 "latest" 预发布（永远指向最新构建）
  # ---------------------------------------------------------------------------
  release:
    name: 发布
    needs: [build, e2e, e2e-openbsd]
    if: github.event_name != 'pull_request' && needs.e2e.result == 'success' && needs.e2e-openbsd.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理资产
        run: |
          set -euo pipefail
          ls -la artifacts
          mkdir -p dist
          cp artifacts/l4fwd-windows-amd64/* dist/
          cp artifacts/l4fwd-linux-amd64/* dist/
          cp artifacts/l4fwd-openbsd-amd64/* dist/
          # 每个平台各有一份 SHA256SUMS.txt，合并成一份（文件名互不重叠）。
          cat artifacts/*/SHA256SUMS.txt > dist/SHA256SUMS.txt
          cp README.md LICENSE config.example.json dist/
          ls -la dist
          for f in l4fwd.exe l4fwd-admin.exe l4fwd-linux-amd64 l4fwd-openbsd-amd64; do
            [ -f "dist/$f" ] || { echo "缺少资产 $f" >&2; exit 1; }
          done

      - name: 发布 / 更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="l4fwd ${REF_NAME#v}"
            CHANNEL_FLAG="--latest"
          else
            TAG="latest"
            TITLE="latest（跟随 master 最新构建）"
            CHANNEL_FLAG="--prerelease --latest=false"
          fi

          cat > NOTES.md <<EOF
          l4fwd 四层 / 原始套接字端口转发工具 ${TAG#v}（Windows / Linux / OpenBSD）。

          三平台均已通过单元测试与端到端测试（GitHub Actions：windows-latest、
          ubuntu-latest、OpenBSD 7.9 虚拟机）。

          资产：
          - l4fwd-<tag>-windows-amd64.zip：l4fwd.exe（不弹 UAC）、l4fwd-admin.exe（UAC，
            额外支持 RAW / 混杂捕获 / 防火墙放行）、rawtest.exe
          - l4fwd-<tag>-linux-amd64.tar.gz：l4fwd、rawtest（RAW 需要 root 或 CAP_NET_RAW）
          - l4fwd-<tag>-openbsd-amd64.tar.gz：l4fwd、rawtest（RAW 与 /dev/bpf 需要 root）
          - SHA256SUMS.txt：校验和

          构建于提交 ${SHA:0:7}。
          EOF

          # 打包用 Linux 的 tar/zip：PowerShell 的 Compress-Archive 会写成反斜杠路径。
          zip -j "l4fwd-${TAG}-windows-amd64.zip" \
            dist/l4fwd.exe dist/l4fwd-admin.exe dist/rawtest.exe dist/README.md dist/LICENSE dist/config.example.json
          tar -czf "l4fwd-${TAG}-linux-amd64.tar.gz" -C dist \
            l4fwd-linux-amd64 rawtest-linux-amd64 README.md LICENSE config.example.json
          tar -czf "l4fwd-${TAG}-openbsd-amd64.tar.gz" -C dist \
            l4fwd-openbsd-amd64 rawtest-openbsd-amd64 README.md LICENSE config.example.json

          assets=(
            dist/l4fwd.exe
            dist/l4fwd-admin.exe
            dist/l4fwd-linux-amd64
            dist/l4fwd-openbsd-amd64
            dist/SHA256SUMS.txt
            "l4fwd-${TAG}-windows-amd64.zip"
            "l4fwd-${TAG}-linux-amd64.tar.gz"
            "l4fwd-${TAG}-openbsd-amd64.tar.gz"
          )
          printf '资产：%s\n' "${assets[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖更新资产"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file NOTES.md $CHANNEL_FLAG
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "${assets[@]}" --title "$TITLE" --notes-file NOTES.md $CHANNEL_FLAG
          fi

          gh release view "$TAG"
